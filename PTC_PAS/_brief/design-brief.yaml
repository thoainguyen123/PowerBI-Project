          balance_rationale: "KPI 25%, hai panel chính 33%, ba panel dưới 42%; không có khoảng trống lớn hoặc panel lẻ."

    - name: "Phân công quyết toán theo PIC"
      role: detail
      archetype: "Analytical Canvas"
      layout_variant: A
      variant_rationale: "Bar ngang ở trên cho xếp hạng nhanh; matrix phía dưới cho tra cứu. Rail lọc thống nhất với trang tổng quan."
      page_background: "#F4F7FB"
      layout_summary: "Rail lọc 264 px bên trái; một chart xếp hạng lớn và một matrix chi tiết trong hai card trắng."
      layout_contract:
        canvas: { width: 1920, height: 1080, margin: 24, gutter: 16, snap: 8 }
        rail: { x: 0, y: 0, width: 264, height: 1080 }
        content: { x: 296, y: 24, width: 1592, height: 1024 }
        placements:

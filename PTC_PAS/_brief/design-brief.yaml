Design Brief:
  generated_by: powerbi-report-design
  contract_version: 4
  mode: brownfield

  objective:
    - "Theo dõi số lượng quyết toán 2026 theo khu vực, dự án và PIC."
    - "Hiển thị rõ cơ cấu trạng thái và tiến độ hoàn thành."
    - "Giữ giao diện Light Analytics hiện tại nhưng thay toàn bộ binding sang KPI nghiệp vụ đã duyệt."

  business_rules:
    report_year_measure: "Data[Năm báo cáo] = 2026"
    contract_metrics:
      "(1)": "Năm mục tiêu không trống."
      "(2)": "Năm mục tiêu bằng năm báo cáo."
      "(2.1)": "Thuộc (2), KPI QUYẾT TOÁN = KPI 417."
      "(2.2)": "Thuộc (2), KPI QUYẾT TOÁN = Ngoài 417."
      "(2.3)": "Phần còn lại của (2)."
      "(3)": "Thuộc (2), năm ký biên bản quyết toán từ năm báo cáo trở đi."
      percent_registered: "(3)/(2.1); có thể vượt 100%."
      percent_2026: "(3)/(2)."
      settled_value: "Tổng GIÁ TRỊ WORKDONE (GỒM VAT) của (3)."
    pic_grain:
      rule: "Một dòng cho mỗi lượt AK hoặc AL."
      warning: "Một HĐ có cả AK và AL được tính hai lượt; tổng giá trị PIC có thể cộng trùng."

  design_identity:
    tone: "Light corporate analytics"
    signature: "Sidebar trắng, nền xanh xám nhạt, panel bo 16 px và accent KPI theo ngữ nghĩa."
    font: "Segoe UI"

  design_tokens:
    canvas: "#F4F7FB"
    surface: "#FFFFFF"
    surface_alt: "#F4F7FB"
    ink: "#172033"
    muted: "#6B7A90"
    border: "#DFE7F1"
    blue: "#2B8FD8"
    navy: "#174A7E"
    cyan: "#2AA7C9"
    teal: "#0E8F9C"
    green: "#1F9D74"
    orange: "#E39A2F"
    coral: "#E76F51"
    red: "#D9534F"
    slate: "#4F6D8A"
    neutral: "#AEB9C7"
    radius: 16
    purple_allowed: false

  status_color_map:
    "Đã quyết toán": "#1F9D74"
    "Đã quyết toán/thanh lý": "#147A5A"
    "Đã thanh lý": "#0E8F9C"
    "NT đang hoàn tất HSQT": "#2B8FD8"
    "Đang thống nhất HSQT": "#2AA7C9"
    "Đang trình HSQT": "#7EB8DA"
    "PAS đang kiểm": "#4F6D8A"
    "NT chưa nộp HSQT": "#E39A2F"
    "Nhà thầu không phối hợp": "#E76F51"
    "Chưa cập nhật": "#AEB9C7"
    "Hủy hợp đồng": "#D9534F"
    "NT đã nộp (thất lạc HS)": "#F1BD69"

  pages:
    - name: "Tổng quan quyết toán"
      canvas: { width: 1720, height: 1190 }
      display_option: "ActualSize"
      placements:
        - id: kpi_1
          kind: cardVisual
          binding: "Data[(1) Số HĐ cần quyết toán]"
        - id: kpi_2
          kind: cardVisual
          binding: "Data[(2) Số HĐ cần quyết toán 2026]"
        - id: kpi_3
          kind: cardVisual
          binding: "Data[(3) Số HĐ hoàn thành 2026]"
        - id: kpi_percent
          kind: cardVisual
          binding: "Data[% Hoàn thành 2026]"
        - id: status_donut
          kind: donutChart
          category: "Data[Tình trạng quyết toán (chuẩn)]"
          value: "Data[(2) Số HĐ cần quyết toán 2026]"
        - id: region_status
          kind: columnChart
          category: "Data[Khu vực chuẩn]"
          series: "Data[Tình trạng quyết toán (chuẩn)]"
          value: "Data[(2) Số HĐ cần quyết toán 2026]"
        - id: region_project_matrix
          kind: pivotTable
          rows:
            - "Data[Khu vực chuẩn]"
            - "Data[TÊN VIẾT TẮT DỰ ÁN/ĐƠN VỊ]"
          value_count: 9

    - name: "Phân công quyết toán theo PIC"
      canvas: { width: 1920, height: 1080 }
      display_option: "FitToPage"
      placements:
        - id: pic_ranking
          kind: barChart
          category: "Phân công PIC[PIC phụ trách]"
          value: "Phân công PIC[(2) Số lượt cần quyết toán 2026]"
        - id: pic_matrix
          kind: pivotTable
          rows:
            - "Phân công PIC[Nhóm PIC]"
            - "Phân công PIC[PIC phụ trách]"
          value_count: 9

  accessibility:
    alt_text: "Mỗi chart mô tả rõ điều kiện mục tiêu 2026."
    color: "Không dùng màu làm tín hiệu duy nhất; luôn có legend hoặc data label."
    tab_order: "Header → slicers → KPI → chart → matrix."

  delivery:
    target: "Local PBIP"
    theme: "LightAnalytics-TQT2026-4f8c2d71.json"
    semantic_model_changes: false
    publish_fabric: false

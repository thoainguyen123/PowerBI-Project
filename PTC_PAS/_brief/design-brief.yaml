      page_background: "#F4F7FB"
      layout_summary: "Rail lọc 264 px bên trái; tiêu đề và nguồn dữ liệu ở đầu; bốn KPI card; hai panel chính; ba panel phân tích phía dưới."
      layout_contract:
        canvas: { width: 1920, height: 1080, margin: 24, gutter: 16, snap: 8 }
        rail: { x: 0, y: 0, width: 264, height: 1080 }
        content: { x: 296, y: 24, width: 1592, height: 1024 }
        placements:
          - id: filter_rail
            kind: shape
            purpose: "Nhóm toàn bộ bộ lọc để vùng phân tích không bị phân mảnh."
          - id: slicers
            kind: slicer
            fields:
              - "Data[Kỳ mục tiêu]"
              - "Data[Khu vực chuẩn]"
              - "Data[TÊN VIẾT TẮT DỰ ÁN/ĐƠN VỊ]"
              - "Data[TÌNH TRẠNG QUYẾT TOÁN]"
          - id: kpi_cards
            kind: cardVisual
            count: 4
            fields:
              - "Data[Số HĐ cần quyết toán]"
              - "Data[Số HĐ hoàn thành]"
              - "Data[Số HĐ cần quyết toán (năm nay)]"
              - "Data[% Hoàn thành]"
          - id: status_backlog
            kind: barChart
            field_bindings: { Category: "Data[TÌNH TRẠNG QUYẾT TOÁN]", Y: "Data[Số HĐ cần quyết toán]" }
          - id: region_volume
            kind: barChart
            field_bindings: { Category: "Data[Khu vực chuẩn]", Y: "Data[Số HĐ cần quyết toán]" }
            purpose: "Làm Hồ Tràm hiện trực tiếp cùng Đồng Nai và HCM."
          - id: top_projects
            kind: barChart
            field_bindings: { Category: "Data[TÊN VIẾT TẮT DỰ ÁN/ĐƠN VỊ]", Y: "Data[Số HĐ cần quyết toán]" }
          - id: top_pic
            kind: barChart
            field_bindings: { Category: "Phân công PIC[PIC phụ trách]", Y: "Phân công PIC[Số lượt HĐ cần quyết toán]" }
          - id: completion_by_region
            kind: barChart
            field_bindings: { Category: "Data[Khu vực chuẩn]", Y: "Data[% Hoàn thành]" }
